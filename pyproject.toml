[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets>=0.5.0",
    "peft>=0.13.0",
    "torch==2.9.0",
    "transformers>=4.46.0",
    "wandb>=0.17.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
stop-mode = "num_rounds"
target-accuracy = 0.90
fraction-train = 0.005
fraction-evaluate = 0.01
local-epochs = 1
learning-rate = 0.003
lr-decay-interval = 20
lr-decay-factor = 0.9
min-learning-rate = 0.0001
min-train-nodes = 1
min-evaluate-nodes = 1
min-available-nodes = 1
batch-size = 16
max-length = 256
weight-decay = 0.01
warmup-ratio = 0.1
max-grad-norm = 1.0
use-lora = true
sync-optimizer = "fedavg"
train-timeout-seconds = 180.0
reply-poll-interval-seconds = 2.0
async-max-in-flight = 1
async-evaluate-interval = 1
async-strategy = "buffered"
async-buffer-size = 4
straggler-enabled = false
straggler-scenario = "balanced"
baseline-mode = "fixed"
baseline-time-seconds = 30.0
staleness-weighting-enabled = false
staleness-weighting-mode = "fedstaleweight"
staleness-exponent = 0.5
fedstaleweight-ema-beta = 0.8
wandb-run-name = ""
dirichlet-alpha = 0.25
fast-delay-seconds = 0.0
medium-delay-seconds = 10.0
slow-delay-seconds = 20.0
