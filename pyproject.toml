[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets>=0.5.0",
    "peft>=0.13.0",
    "torch==2.8.0",
    "transformers>=4.46.0",
    "wandb>=0.17.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app_async:app"
clientapp = "pytorchexample.client_app_async:app"

[tool.flwr.app.config]
num-server-rounds = 16
fraction-train = 0.01
fraction-evaluate = 0.02
local-epochs = 1
learning-rate = 0.005
lr-decay-interval = 20
lr-decay-factor = 0.9
min-learning-rate = 0.0001
staleness-weighting-mode = "fedstaleweight"
fedstaleweight-ema-beta = 0.8
min-train-nodes = 2
min-evaluate-nodes = 2
min-available-nodes = 2
batch-size = 16
weight-decay = 0.01
warmup-ratio = 0.1
max-grad-norm = 1.0
train-timeout-seconds = 300.0
reply-poll-interval-seconds = 2.0
async-max-in-flight = 2
async-evaluate-interval = 2
async-strategy = "buffered"
async-buffer-size = 2
straggler-enabled = true
straggler-scenario = "balanced"
baseline-mode = "fixed"
baseline-time-seconds = 50.0
staleness-weighting-enabled = true
staleness-exponent = 0.5
