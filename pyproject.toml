[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets>=0.5.0",
    "peft>=0.13.0",
    "torch==2.8.0",
    "transformers>=4.46.0",
    "wandb>=0.17.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-train = 0.025
fraction-evaluate = 0.05
local-epochs = 1
learning-rate = 0.1
batch-size = 32
weight-decay = 0.01
warmup-ratio = 0.1
max-grad-norm = 1.0
train-timeout-seconds = 120.0
reply-poll-interval-seconds = 2.0
async-max-in-flight = 4
async-evaluate-interval = 4
async-strategy = "immediate"
async-buffer-size = 4
straggler-enabled = false
straggler-scenario = "balanced"
baseline-mode = "measured"
baseline-time-seconds = 60.0
staleness-weighting-enabled = false
staleness-exponent = 1.0

[tool.pytorchexample.config.synchronous]
num-server-rounds = 3
fraction-train = 0.025
fraction-evaluate = 0.05
local-epochs = 1
learning-rate = 0.1
batch-size = 32
weight-decay = 0.01
warmup-ratio = 0.1
max-grad-norm = 1.0
min-train-nodes = 10
min-evaluate-nodes = 10
min-available-nodes = 10
straggler-enabled = false
straggler-scenario = "balanced"
baseline-mode = "measured"
baseline-time-seconds = 60.0

[tool.pytorchexample.config.asynchronous]
num-server-rounds = 3
fraction-train = 0.025
fraction-evaluate = 0.05
local-epochs = 1
learning-rate = 0.1
batch-size = 32
weight-decay = 0.01
warmup-ratio = 0.1
max-grad-norm = 1.0
train-timeout-seconds = 120.0
reply-poll-interval-seconds = 2.0
async-max-in-flight = 4
async-evaluate-interval = 4
async-strategy = "immediate"
straggler-enabled = false
straggler-scenario = "balanced"
baseline-mode = "measured"
baseline-time-seconds = 60.0
staleness-weighting-enabled = false
staleness-exponent = 1.0

[tool.pytorchexample.config.asynchronous-buffered]
num-server-rounds = 3
fraction-train = 0.025
fraction-evaluate = 0.05
local-epochs = 1
learning-rate = 0.1
batch-size = 32
weight-decay = 0.01
warmup-ratio = 0.1
max-grad-norm = 1.0
train-timeout-seconds = 120.0
reply-poll-interval-seconds = 2.0
async-max-in-flight = 4
async-evaluate-interval = 4
async-strategy = "buffered"
async-buffer-size = 4
straggler-enabled = false
straggler-scenario = "balanced"
baseline-mode = "measured"
baseline-time-seconds = 60.0
staleness-weighting-enabled = false
staleness-exponent = 1.0
